defaults:
  metadata:
    labels:
      edge: "true"
  spec:
    project: agent-default
    destination:
      name: "{{ .Values.clusterName }}"
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
apps:
  argocd-core:
    spec:
      sources:
      - repoURL: https://github.com/argoproj/argo-cd.git
        targetRevision: v3.4.1
        path: manifests/core-install
        kustomize:
          namespace: argocd
      - repoURL: https://github.com/poxelyric/argo-flavors.git
        targetRevision: HEAD
        ref: definitions
      - repoURL: https://github.com/poxelyric/argo-flavors.git
        targetRevision: HEAD
        path: serviceset
        helm:
          values: |-
            flavor: {{ .Values.flavor }}
            clusterName: .
          valueFiles:
            {{- include "clusterset.valueFiles" . | indent 14 }}
      syncPolicy:
        automated: {}