defaults:
  apiVersion: argoproj.io/v1alpha1
  kind: Application
  metadata:
    name: "{{ .appName }}-{{ .Values.clusterName }}"
    namespace: argocd
  spec:
    destination:
      server: https://kubernetes.default.svc
    #project: default
    source:
      repoURL: https://github.com/example/services-repo

appDictKey: apps

# default clusterName for testing purposes
clusterName: myCluster

