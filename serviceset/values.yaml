defaults:
  apiVersion: argoproj.io/v1alpha1
  kind: Application
  metadata:
    name: "{{ .appName }}-{{ .Values.clusterName }}"
    namespace: argocd
  spec:
    destination:
      server: https://kubernetes.default.svc
    project: default
    source:
      repoURL: https://github.com/example/services-repo
      helm:
        valueFiles:
          - values.yaml
      kustomize:
        patchesStrategicMerge:
          - patch.yaml

appDictKey: apps

mutuallyExclusiveFields: [
  [
  spec.source,
  spec.sources
  ],
  [
  spec.source.kustomize,
  spec.source.directory,
  spec.source.plugin,
  spec.source.helm
  ]
]

# default clusterName for testing purposes
clusterName: myCluster

