{{- $apps := merge dict (get .Values .Values.appDictKey) -}}
{{- range $k, $v := $apps }}
{{- $context := dict "Values" $.Values "appName" $k }}
{{- $defaultApp := tpl (toYaml $.Values.defaults) $context | fromYaml }}
{{- $patches := tpl (toYaml $v) $context | fromYaml }}
---
{{ mergeOverwrite $defaultApp $patches | toYaml }}
{{- end }}