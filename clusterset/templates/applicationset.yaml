apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.applicationset.name }}
  namespace: {{ .Values.applicationset.namespace }}
spec:
  generators:
  - git:
      repoURL: {{ .Values.applicationset.definitionsRepo.repoURL | quote }}
      revision: {{ .Values.applicationset.definitionsRepo.targetRevision | quote }}
      files:
      - path: "{{ .Values.applicationset.definitionsRepo.basePath }}/**/{{ .Values.env }}/[^_]*.yaml"
  template:
    metadata:
      name: '{{`{{path.basename}}`}}-cluster'
    spec:
      project: default
      source:
        repoURL: https://machine    #TODO: Update this to the actual repo URL where the deployment charts is stored
        targetRevision: HEAD #TODO: Edit from values.yaml
        path: serviceset
      destination:
        server: https://kubernetes.default.svc