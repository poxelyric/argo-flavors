apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.applicationset.name }}
  namespace: {{ .Values.applicationset.namespace }}
spec:
  goTemplate: true
  generators:
  - git:
      repoURL: {{ .Values.definitionsRepo.repoURL | quote }}
      revision: {{ .Values.definitionsRepo.targetRevision | quote }}
      files:
      - path: "{{ .Values.definitionsRepo.basePath }}/**/{{ .Values.env }}/[^{{ .Values.appFile.prefix }}]*.yaml"
  template:
    metadata:
      name: '{{ include "clusterset.clusterName" . }}'
    spec:
      destination:
        server: https://kubernetes.default.svc
      project: {{ .Values.applicationset.project | default "default" }}
  templatePatch: |-
    spec:
      sources:
        - repoURL: {{ .Values.definitionsRepo.repoURL | quote }}
          targetRevision: {{ .Values.definitionsRepo.targetRevision | quote }}
          ref: definitions
        - repoURL: https://machine    #TODO: Update this to the actual repo URL where the deployment charts is stored
          targetRevision: HEAD #TODO: Edit from values.yaml
          path: serviceset
          helm:
            valueFiles:
              {{- include "clusterset.valueFiles" . | indent 14 }}
