apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.applicationset.name | default .Release.Name }}
  namespace: {{ include "clusterset.namespace" . }}
spec:
  goTemplate: true
  generators:
  - git:
      repoURL: {{ .Values.definitionsRepo.repoURL | quote }}
      revision: {{ .Values.definitionsRepo.targetRevision | quote }}
      files:
      - path: "{{ .Values.definitionsRepo.basePath }}/**/{{ .Values.env }}/[^{{ .Values.appsFile.prefix }}]*.yaml"
  template:
    metadata:
      name: '{{ include "clusterset.clusterName" . }}{{ .Values.appSuffix }}'
      labels:
        type: serviceset
        env: {{ .Values.env | quote }}
    spec:
      destination:
        server: https://kubernetes.default.svc
      project: {{ .Values.applicationset.project | default "default" }}
  templatePatch: |-
    syncPolicy:
      {{- toYaml .Values.syncPolicy | nindent 6 }}
    spec:
      sources:
        - repoURL: {{ .Values.definitionsRepo.repoURL | quote }}
          targetRevision: {{ .Values.definitionsRepo.targetRevision | quote }}
          ref: definitions
        - repoURL: {{ .Values.servicesetSource.repoURL | quote }}
          targetRevision: {{ .Values.servicesetSource.targetRevision | quote }}
          path: {{ .Values.servicesetSource.path }}
          helm:
            values: |-
              {{- include "clusterset.values" . | indent 14 }}
            valueFiles:
              {{- include "clusterset.valueFiles" . | indent 14 }}
