# Default values for clusterset chart
applicationset:
  name: my-applicationset
  namespace: argocd
  generators:
    - list:
        elements:
          - cluster: cluster1
            url: https://kubernetes.default.svc
          - cluster: cluster2
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: '{{cluster}}-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/example/repo
        targetRevision: HEAD
        path: .
      destination:
        server: '{{url}}'
        namespace: default